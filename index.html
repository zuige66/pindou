<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>豆格 BEADGRID · 图片转拼豆图纸</title>
  <style>
    :root{
      --md-primary:#6750A4;
      --md-primary-container:#EADDFF;
      --md-on-primary:#FFFFFF;
      --md-on-primary-container:#21005D;
      --md-secondary:#625B71;
      --md-secondary-container:#E8DEF8;
      --md-on-secondary-container:#1D192B;
      --md-tertiary:#7D5260;
      --md-tertiary-container:#FFD8E4;
      --md-surface:#FEF7FF;
      --md-surface-variant:#E7E0EC;
      --md-surface-container:#F3EDF7;
      --md-surface-container-high:#ECE6F0;
      --md-surface-container-lowest:#FFFFFF;
      --md-on-surface:#1D1B20;
      --md-on-surface-variant:#49454F;
      --md-outline:#79747E;
      --md-outline-variant:#CAC4D0;
      --md-error:#B3261E;
      --md-shadow-1:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.24);
      --md-shadow-2:0 2px 6px rgba(0,0,0,.15),0 2px 4px rgba(0,0,0,.10);
      --md-shadow-3:0 4px 12px rgba(0,0,0,.15),0 4px 8px rgba(0,0,0,.10);
    }
    *{box-sizing:border-box}[hidden]{display:none!important}
    html,body{height:100%}
    body{margin:0;min-height:100vh;color:var(--md-on-surface);background:var(--md-surface);font-family:Google Sans,Inter,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.1px}
    button,input,select{font:inherit}button{color:inherit}
    .shell{width:min(1800px,calc(100% - 32px));margin:auto;padding:12px 0 16px;height:100vh;display:flex;flex-direction:column}
    header{height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:0 4px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:36px;height:36px;border:2px solid var(--md-primary);border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px;transform:rotate(-3deg)}
    .logo i{display:block;border-radius:50%;background:var(--md-primary)}
    .brand h1{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:600}
    .brand p{margin:2px 0 0;color:var(--md-on-surface-variant);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
    .head-info{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--md-on-surface-variant)}
    .privacy{padding:6px 12px;border-radius:99px;background:var(--md-secondary-container);color:var(--md-on-secondary-container);font-weight:500}
    .app{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0;background:var(--md-surface-container);border-radius:28px;overflow:hidden;box-shadow:var(--md-shadow-2)}
    aside{padding:20px 16px;overflow:auto;background:var(--md-surface-container-lowest)}
    .left{display:flex;flex-direction:column;gap:0}
    main{min-width:0;padding:12px;background:var(--md-surface-container);display:flex;flex-direction:column;min-height:0}
    .section{margin-bottom:8px}
    .section+.section{border-top:none;margin-top:12px;padding-top:12px}
    .sect-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px}
    .sect-head b{font-size:13px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--md-on-surface-variant)}
    .action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .action-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 8px;border:none;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;background:var(--md-surface-container-high);color:var(--md-on-surface);box-shadow:var(--md-shadow-1)}
    .action-btn input{display:none}
    .action-icon{width:24px;height:24px;flex-shrink:0;stroke-width:2.2!important}
    .action-upload{background:var(--md-primary-container);color:var(--md-on-primary-container)}
    .action-upload:hover,.action-upload.drag{filter:brightness(.94)}
    .action-download{background:var(--md-primary);color:var(--md-on-primary)}
    .action-download:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
    .action-download:not(:disabled):hover{filter:brightness(1.08)}
    .row{display:block;margin:12px 0}
    .row-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;color:var(--md-on-surface-variant)}
    .row output{color:var(--md-primary);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
    input[type=range]{width:100%;accent-color:var(--md-primary);height:20px}
    .preset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .preset button{border:none;background:var(--md-surface-container-high);border-radius:999px;padding:9px 8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;color:var(--md-on-surface)}
    .preset button:hover{background:var(--md-surface-variant)}
    .preset button.active{background:var(--md-secondary-container);color:var(--md-on-secondary-container);font-weight:600}
    .checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .check{font-size:12px;display:flex;gap:8px;align-items:center;color:var(--md-on-surface-variant);cursor:pointer}
    .check input{accent-color:var(--md-primary);width:16px;height:16px;margin:0}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-shrink:0;padding:0 4px}
    .crumb{font-size:12px;color:var(--md-on-surface-variant);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
    .crumb strong{color:var(--md-on-surface);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none}
    .tools{display:flex;gap:8px}
    .tool{border:none;background:var(--md-surface-container-high);border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;min-width:44px;font-weight:600;transition:.15s;color:var(--md-on-surface)}
    .tool:hover{background:var(--md-surface-variant)}
    .board-shell{flex:1;min-height:0;display:grid;overflow:auto;border-radius:24px;background:var(--md-surface-container-lowest);padding:20px;box-shadow:var(--md-shadow-1)}
    .canvas-wrap{position:relative;background:var(--md-surface-container-lowest);border-radius:16px;box-shadow:var(--md-shadow-2);line-height:0;margin:auto;overflow:visible}
    .canvas-wrap canvas{display:block;image-rendering:pixelated;border-radius:16px;cursor:zoom-in}
    .empty{width:min(480px,65%);aspect-ratio:1;display:grid;place-items:center;text-align:center;color:var(--md-on-surface-variant);padding:32px;line-height:1.7;margin:auto}
    .empty-art{display:grid;grid-template-columns:repeat(8,11px);gap:3px;justify-content:center;margin-bottom:16px}
    .empty-art i{width:11px;height:11px;border-radius:50%;background:var(--md-outline-variant)}
    .empty-art i:nth-child(3n){background:var(--md-primary)}
    .empty-art i:nth-child(5n){background:var(--md-tertiary)}
    .empty strong{display:block;color:var(--md-on-surface);font-size:16px;font-weight:600;margin-bottom:4px}
    .status{display:flex;justify-content:space-between;padding:8px 8px 0;color:var(--md-on-surface-variant);font-size:11px;flex-shrink:0}
    .status span:last-child{color:#457446}
    .thumb-strip{display:flex;gap:8px;padding:10px 8px 0;overflow-x:auto;flex-shrink:0;border-top:1px solid var(--md-outline-variant,#ccc);margin-top:8px}
    .thumb-strip::-webkit-scrollbar{height:6px}
    .thumb-strip::-webkit-scrollbar-thumb{background:var(--md-surface-variant,#ccc);border-radius:3px}
    .thumb{position:relative;flex-shrink:0;width:56px;height:56px;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--md-surface-container-high,#eee);transition:.15s}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .thumb:hover{transform:translateY(-2px)}
    .thumb.active{border-color:var(--md-primary,#333);box-shadow:0 0 0 1px var(--md-primary,#333)}
    .thumb-num{position:absolute;top:2px;left:4px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;font-weight:600}
    .thumb-del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}
    .thumb:hover .thumb-del{opacity:1}
    .thumb-del:hover{background:rgba(220,40,40,.85)}
    .collage-fab{position:fixed;right:24px;bottom:24px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--md-primary);color:var(--md-on-primary);border:none;border-radius:999px;padding:14px 20px;gap:8px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:.2s}
    .collage-fab:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.24)}
    .collage-fab svg{width:20px;height:20px}
    .collage-page{position:fixed;inset:0;z-index:100;background:var(--md-background);display:flex;flex-direction:column}
    .collage-header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--md-surface);border-bottom:1px solid var(--md-outline-variant)}
    .collage-header strong{font-size:16px;font-weight:600}
    .collage-back{border:none;background:transparent;color:var(--md-primary);font-size:14px;font-weight:600;cursor:pointer;padding:8px 12px;border-radius:8px}
    .collage-back:hover{background:var(--md-surface-variant)}
    .collage-tools{display:flex;align-items:center;gap:16px;margin-left:auto}
    .collage-grid-picker{display:flex;gap:6px}
    .collage-grid-picker button{border:none;background:var(--md-surface-container-high);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--md-on-surface);transition:.15s}
    .collage-grid-picker button:hover{background:var(--md-surface-variant)}
    .collage-grid-picker button.active{background:var(--md-primary);color:var(--md-on-primary)}
    .collage-gap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--md-on-surface-variant)}
    .collage-gap input{width:80px;accent-color:var(--md-primary)}
    .collage-gap output{color:var(--md-primary);font-weight:700}
    .collage-download{border:none;background:var(--md-primary);color:var(--md-on-primary);border-radius:999px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
    .collage-download:hover{filter:brightness(1.08)}
    .collage-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;background:var(--md-surface-container-lowest)}
    .collage-canvas-wrap canvas{max-width:100%;max-height:100%;border-radius:16px;box-shadow:var(--md-shadow-2);cursor:default}
    .collage-canvas-wrap canvas.dragging{cursor:grabbing}
    .collage-hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--md-on-surface-variant);background:var(--md-surface-container);padding:6px 14px;border-radius:999px;pointer-events:none;opacity:.85}
    .collage-tray{display:flex;gap:10px;padding:12px 24px;background:var(--md-surface);border-top:1px solid var(--md-outline-variant);overflow-x:auto;flex-shrink:0}
    .collage-slot{flex-shrink:0;width:60px;height:60px;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--md-surface-container-high);transition:.15s;position:relative}
    .collage-slot img{width:100%;height:100%;object-fit:cover;pointer-events:none}
    .collage-slot:hover{border-color:var(--md-primary)}
    .collage-slot.drag-over{border-color:var(--md-primary);box-shadow:0 0 0 2px var(--md-primary)}
    .collage-slot.selected{border-color:var(--md-primary);box-shadow:0 0 0 2px var(--md-primary)}
    .collage-slot .slot-del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
    .collage-slot .slot-label{position:absolute;bottom:1px;left:3px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;font-weight:700}
    .collage-canvas-wrap canvas.drag-over-cell{box-shadow:0 0 0 3px var(--md-primary)}
    .summary{border-radius:20px;padding:16px;background:var(--md-surface-container-high);color:var(--md-on-surface);box-shadow:var(--md-shadow-1)}
    .sum-top{display:flex;justify-content:space-between;align-items:end}
    .sum-top span{font-size:11px;color:var(--md-on-surface-variant);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
    .sum-top strong{font:600 28px/1.2 sans-serif;color:var(--md-on-surface);letter-spacing:-.02em}
    .sum-grid{display:grid;grid-template-columns:repeat(2,1fr);margin-top:14px;border-top:1px solid var(--md-outline-variant);padding-top:14px;gap:4px}
    .sum-grid div{text-align:center}
    .sum-grid b,.sum-grid small{display:block}
    .sum-grid b{font-size:16px;color:var(--md-primary);font-weight:700}
    .sum-grid small{font-size:10px;color:var(--md-on-surface-variant);margin-top:4px;letter-spacing:.05em}
    .palette-list{display:grid;grid-template-columns:1fr;gap:8px;max-height:380px;overflow:auto;padding-right:4px}
    .color-row{display:grid;grid-template-columns:32px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--md-surface-container-lowest);box-shadow:var(--md-shadow-1)}
    .bead{width:28px;height:28px;border-radius:8px;border:none;display:block;flex-shrink:0}
    .color-info{display:flex;flex-direction:column;gap:2px;min-width:0}
    .color-info b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
    .color-info small{font-size:10px;color:var(--md-on-surface-variant)}
    .count{font:700 12px/1 monospace;color:var(--md-on-surface)}
    .replace-btn{border:none;background:var(--md-primary-container);color:var(--md-on-primary-container);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
    .replace-btn:hover{filter:brightness(.95)}
    .modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);padding:24px;display:grid;place-items:center}
    .modal img{max-width:94vw;max-height:90vh;background:#fff;border-radius:16px;box-shadow:var(--md-shadow-3);image-rendering:pixelated}
    .modal button{position:fixed;right:24px;top:20px;width:44px;height:44px;border:none;background:var(--md-surface-container-high);color:var(--md-on-surface);border-radius:50%;font-size:22px;cursor:pointer;transition:.15s;box-shadow:var(--md-shadow-1)}
    .modal button:hover{background:var(--md-surface-variant)}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#322F35;color:white;padding:12px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;font-weight:500}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .replace-modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}
    .replace-box{background:var(--md-surface);border-radius:28px;padding:24px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--md-shadow-3)}
    .replace-box h3{margin:0 0 4px;font-size:20px;color:var(--md-on-surface);font-weight:600}
    .replace-box p{margin:0 0 16px;font-size:13px;color:var(--md-on-surface-variant)}
    .replace-search{width:100%;padding:12px 16px;border:1px solid var(--md-outline);border-radius:12px;font-size:14px;margin-bottom:16px;background:var(--md-surface-container-high);color:var(--md-on-surface);outline:none}
    .replace-search:focus{border-color:var(--md-primary)}
    .replace-colors{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-height:420px;overflow:auto}
    .replace-color{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border:none;border-radius:12px;cursor:pointer;transition:.15s;background:var(--md-surface-container-lowest);box-shadow:var(--md-shadow-1)}
    .replace-color:hover{background:var(--md-primary-container);transform:translateY(-2px)}
    .replace-color .sw{width:36px;height:36px;border-radius:8px;border:none}
    .replace-color b{font-size:10px;color:var(--md-on-surface);font-weight:600}
    .replace-color small{font-size:9px;color:var(--md-on-surface-variant)}
    .replace-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
    .replace-cancel{padding:10px 24px;border:none;background:var(--md-surface-container-high);color:var(--md-on-surface);border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
    .replace-cancel:hover{background:var(--md-surface-variant)}
    @media(max-width:1200px){.app{grid-template-columns:220px 1fr}}
    @media(max-width:900px){.shell{width:100%;padding:0;height:auto;min-height:100vh}.head-info{display:none}header{padding:0 14px}.app{display:flex;flex-direction:column;border-radius:0;min-height:auto}.left{order:2}.board-shell{min-height:500px;overflow:auto}.empty{width:82vw}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="logo"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div><h1>豆格 BEADGRID</h1><p>IMAGE TO FUSE BEAD PATTERN</p></div>
      </div>
      <div class="head-info"><span>每一格，都是一颗豆</span><span class="privacy">● 仅在浏览器本地处理</span></div>
    </header>
    <div class="app">
      <aside class="left">
        <section class="section">
          <div class="sect-head"><b>操作</b></div>
          <div class="action-row">
            <label class="action-btn action-upload" id="drop" title="点击或拖入图片上传（可多选）">
              <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple>
              <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>上传</span>
            </label>
            <button class="action-btn action-download" id="download" disabled title="下载正方格施工图 PNG（多图时打包全部下载）">
              <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span id="downloadLabel">下载</span>
            </button>
          </div>
        </section>
        <section class="section">
          <div class="summary">
            <div class="sum-top"><span>总数</span><strong id="totalCount">0</strong></div>
            <div class="sum-grid">
              <div><b id="sizeStat">0×0</b><small>宽 × 高</small></div>
              <div><b id="colorStat">0</b><small>实际颜色</small></div>
            </div>
          </div>
        </section>
        <section class="section">
          <div class="sect-head"><b>参数调节</b></div>
          <div class="preset">
            <button data-preset="easy">简单</button>
            <button class="active" data-preset="balanced">均衡</button>
            <button data-preset="detail">精细</button>
          </div>
          <label class="row">
            <span class="row-head"><span>像素大小</span><output id="widthVal">48 颗</output></span>
            <input id="gridWidth" type="range" min="15" max="116" value="48">
          </label>
          <label class="row">
            <span class="row-head"><span>颜色数量</span><output id="colorsVal">24 色</output></span>
            <input id="maxColors" type="range" min="2" max="60" value="24">
          </label>
          <label class="row">
            <span class="row-head"><span>亮度</span><output id="brightVal">0</output></span>
            <input id="bright" type="range" min="-30" max="30" value="0">
          </label>
          <label class="row">
            <span class="row-head"><span>饱和度</span><output id="satVal">0</output></span>
            <input id="sat" type="range" min="-40" max="40" value="0">
          </label>
          <label class="row">
            <span class="row-head"><span>平滑度</span><output id="smoothVal">0</output></span>
            <input id="smooth" type="range" min="0" max="10" value="0">
          </label>
        </section>
        <section class="section">
          <div class="sect-head"><b>图纸外观</b></div>
          <div class="checks">
            <label class="check"><input id="showGrid" type="checkbox" checked>显示细网格</label>
            <label class="check"><input id="showCodes" type="checkbox" checked>格内显示色号</label>
            <label class="check"><input id="boardLines" type="checkbox" checked>5/10格红线</label>
            <label class="check"><input id="mirror" type="checkbox">水平镜像</label>
            <label class="check"><input id="showLegend" type="checkbox" checked>显示颜色与个数</label>
            <label class="check"><input id="showAxis" type="checkbox" checked>显示横纵坐标</label>
          </div>
        </section>
        <section class="section" style="margin-bottom:10px">
          <div class="sect-head"><b>用豆清单</b><span id="listNum" style="font-size:11px;color:var(--md-on-surface-variant)">0 COLORS</span></div>
          <div class="palette-list" id="paletteList">
            <div style="font-size:11px;color:var(--md-on-surface-variant);padding:14px 0">生成图纸后，在这里查看色号与准确数量。</div>
          </div>
        </section>
      </aside>
      <main>
        <div class="toolbar">

  <script>
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const palettes={
      midi:[['A01','奶油白','#F4F1E8'],['A02','柠檬黄','#F5DD42'],['A03','橙黄','#F5A33C'],['A04','珊瑚橙','#F07145'],['A05','正红','#D8443E'],['A06','酒红','#94353B'],['A07','樱花粉','#F3A8B6'],['A08','玫粉','#D95C91'],['A09','淡紫','#C5A8E0'],['A10','葡萄紫','#78529B'],['A11','深紫','#51365E'],['A12','婴儿蓝','#9BC7E8'],['A13','天蓝','#55A7D9'],['A14','宝蓝','#3373B7'],['A15','海军蓝','#243E69'],['A16','薄荷绿','#9AD9C2'],['A17','草绿','#6AB766'],['A18','翠绿','#278A62'],['A19','墨绿','#285644'],['A20','青蓝','#3D9F9C'],['A21','湖蓝','#4FB7BE'],['A22','肤色','#EBC39D'],['A23','杏色','#D99C72'],['A24','焦糖','#B7784E'],['A25','棕色','#784E3B'],['A26','深棕','#49372F'],['A27','暖灰','#B9B6AC'],['A28','中灰','#858986'],['A29','深灰','#4C5352'],['A30','黑色','#242625'],['A31','纯白','#FFFFFF'],['A32','荧光绿','#B8D94A'],['A33','橄榄绿','#8C954E'],['A34','砖红','#A94E40'],['A35','冰蓝','#C6E0E1'],['A36','浅粉','#F5CFD2']],
      basic:[['B01','白','#FFFFFF'],['B02','黄','#F2D63D'],['B03','橙','#ED8B3A'],['B04','红','#D7463F'],['B05','粉','#ED91AC'],['B06','紫','#765292'],['B07','浅蓝','#86BFE1'],['B08','蓝','#3979B7'],['B09','深蓝','#253E67'],['B10','浅绿','#86C879'],['B11','绿','#378E5B'],['B12','肤色','#E6BA91'],['B13','棕','#86563E'],['B14','浅灰','#BABCB6'],['B15','深灰','#565B59'],['B16','黑','#262827']],

    const mardGroups={

      B:'dff13b 64f343 a1f586 5fdf34 39e158 64e0a4 3eae7c 1d9b54 2a5037 9ad1ba 627032 1a6e3d c8e87d abe84f 305335 c0ed9c 9eb33e e6ed4f 26b78e cbeccf 18616a 0a4241 343b1a e8faa6 4e846d 907c35 d0e0af 9ee5bb c6df5f e3fbb1 b4e691 92ad60',
      C:'f0fee4 abf8fe a2e0f7 44cdfb 06aadf 54a7e9 3977ca 0f52bd 3349c3 3cbce3 2aded3 1e334e cde7fe d5fcf7 21c5c4 1858a2 02d1f3 213244 18869d 1a70a9 bcddfc 6bb1bb c8e2fd 7ec5f9 a9e8e0 42adcf d0def9 bdcee8 364a89',
      D:'acb7ef 868dd3 3554af 162d7b b34ec6 b37bdc 8758a9 e3d2fe d5b9f4 301a49 beb9e2 dc99ce b5038d 862993 2f1f8c e2e4f0 c7d3f9 9a64b8 d8c2d9 9a35ad 940595 38389a eadbf8 768ae1 4950c2 d6c6eb',
      E:'f6d4cb fcc1dd f6bde8 e8649e f0569f eb4172 c53674 fddbe9 e376c7 d13b95 f7dad4 f693bf b5026a fad4bf f5c9ca fbf4ec f7e3ec f9c8db f6bbd1 d7c6ce c09da4 b38c9f 937d8a debee5',
      F:'fe9381 f63d4b ee4e3e fb2a40 e10328 913635 911932 bb0126 e0677a 874628 592323 f3536b f45c45 fcadb2 d50527 f8c0a9 e89b7d d07f4a be454a c69495 f2b8c6 f7c3d0 ed806c e09daf e84854',
      G:'ffe4d3 fcc6ac f1c4a5 dcb387 e7b34e e3a014 985c3a 713d2f e4b685 da8c42 dac898 fec993 b2714b 8b684c f6f8e3 f2d8c1 77544e ffe3d5 dd7d41 a5452f b38561',
      H:'ffffff fbfbfb b4b4b4 878787 464648 2c2c2c 010101 e7d6dc efedee ebebeb cdcdcd fdf6ee f4edf1 ced7d4 9aa6a6 1b1213 f0eeef fcfff6 f2eee5 96a09f f8fbe6 cacad2 9b9c94',
      M:'bbc6b6 909994 697e81 e0d4bc d1ccaf b0aa86 b0a796 ae8082 a68862 c4b3bb 9d7693 644b51 c79266 c27563 747d7a'
    };
    palettes.mard=Object.entries(mardGroups).flatMap(([group,values])=>values.split(' ').map((hex,i)=>[group+(i+1),'MARD '+group+(i+1),'#'+hex.toUpperCase()]));
    let img=null,result=null,dither=false,zoom=1,timer;
    let replaceTargetIndex=-1;
    let silentGenerate=false;
    let images=[],currentIdx=-1;
    const canvas=$('#canvas'),ctx=canvas.getContext('2d',{alpha:false});
    function rgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
    function dist(a,b){const rm=(a[0]+b[0])/2,dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2];return (2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db}
    function findWhiteIdx(pal){let best=0,bd=Infinity,white=[255,255,255];for(let i=0;i<pal.length;i++){let d=dist(rgb(pal[i][2]),white);if(d<bd){bd=d;best=i}}return best}
    function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    function readFiles(files,append){
      const arr=[...files].filter(f=>f&&f.type.startsWith('image/'));
      if(!arr.length)return toast('请选择 JPG、PNG 或 WEBP 图片');
      if(!append)images=[];
      let pending=arr.length;
      arr.forEach(f=>{
        const rd=new FileReader;
        rd.onload=e=>{
          const im=new Image;
          im.onload=()=>{
            images.push({name:f.name,img:im,result:null});
            if(--pending===0){
              currentIdx=append&&currentIdx>=0?currentIdx:images.length-arr.length;
              selectImage(currentIdx);
            }
          };
          im.src=e.target.result;
        };
        rd.readAsDataURL(f);
      });
    }
    function selectImage(idx){
      if(idx<0||idx>=images.length)return;
      currentIdx=idx;
      const item=images[idx];
      img=item.img;
      result=item.result;
      $('#fileInfo').textContent=item.name+' · '+item.img.width+'×'+item.img.height;
      $('#downloadLabel').textContent=images.length>1?`下载全部 ${images.length} 张`:'下载';
      renderThumbs();
      if(result){render();stats()}else{generate()}
    }
    function renderThumbs(){
      const strip=$('#thumbStrip');
      const fab=$('#collageFab');
      if(images.length<=1){strip.hidden=true;strip.innerHTML='';fab.hidden=true;return}
      strip.hidden=false;
      fab.hidden=false;
      strip.innerHTML=images.map((it,i)=>`<div class="thumb${i===currentIdx?' active':''}" data-idx="${i}"><span class="thumb-num">${i+1}</span><img src="${it.img.src}" alt="${it.name}"><button class="thumb-del" data-del="${i}" title="移除">×</button></div>`).join('');
      [...strip.querySelectorAll('.thumb')].forEach(el=>el.onclick=e=>{if(e.target.dataset.del!==undefined)return;selectImage(+el.dataset.idx)});
      [...strip.querySelectorAll('.thumb-del')].forEach(el=>el.onclick=e=>{e.stopPropagation();removeImage(+el.dataset.del)});
    }
    function removeImage(idx){
      images.splice(idx,1);
      collage.order=collage.order
        .filter(i=>i!==idx)
        .map(i=>i>idx?i-1:i);
      if(collage.order.length===0)collage.grid=2;
      if(images.length<2){$('#collageFab').hidden=true;$('#collagePage').hidden=true}
      if(images.length===0){
        currentIdx=-1;img=null;result=null;
        canvas.hidden=true;$('#empty').hidden=false;
        $('#fileInfo').textContent='等待图片 · 未开始处理';
        $('#download').disabled=true;
        $('#downloadLabel').textContent='下载';
        $('#thumbStrip').hidden=true;$('#thumbStrip').innerHTML='';
        $('#totalCount').textContent='0 颗';$('#sizeStat').textContent='0×0';$('#colorStat').textContent='0';
        $('#paletteList').innerHTML='<div style="font-size:11px;color:var(--md-on-surface-variant);padding:14px 0">生成图纸后，在这里查看色号与准确数量。</div>';$('#listNum').textContent='0 COLORS';
        return;
      }
      if(idx<currentIdx)currentIdx--;
      else if(idx===currentIdx){if(currentIdx>=images.length)currentIdx=images.length-1}
      selectImage(currentIdx);
      if(!$('#collagePage').hidden){renderCollageTray();renderCollage()}
    }
    function schedule(){clearTimeout(timer);timer=setTimeout(()=>{
      if(currentIdx>=0)generate();
    },80)}
    function denoise(cells,w,h,pal,smooth){
      const N=w*h;
      const nx8=[-1,0,1,-1,1,-1,0,1],ny8=[-1,-1,-1,0,0,1,1,1];
      if(smooth<=0){
        const newCells=cells.slice();
        for(let y=0;y<h;y++){
          for(let x=0;x<w;x++){
            const i=y*w+x;
            const counts={};
            let maxCount=0,maxPi=-1;
            for(let d=0;d<8;d++){
              const nx=x+nx8[d],ny=y+ny8[d];
              if(nx<0||nx>=w||ny<0||ny>=h)continue;
              const ni=ny*w+nx;
              const pi=cells[ni];
              counts[pi]=(counts[pi]||0)+1;
              if(counts[pi]>maxCount){maxCount=counts[pi];maxPi=pi}
            }
            if(maxCount>=5&&maxPi!==cells[i]){
              newCells[i]=maxPi;
            }
          }
        }
        for(let i=0;i<N;i++)cells[i]=newCells[i];
        return;
      }
      const threshold=Math.max(2,Math.round(smooth*smooth*0.8+smooth*1.2));
      const labels=new Int32Array(N);
      const sizes=new Uint32Array(N);
      let currentLabel=0;
      for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
          const i=y*w+x;
          if(labels[i])continue;
          currentLabel++;
          const targetPi=cells[i];
          const queue=[i];
          labels[i]=currentLabel;
          let size=0;
          while(queue.length){
            const cur=queue.shift();
            size++;
            const cx=cur%w,cy=(cur-cx)/w;
            for(let d=0;d<8;d++){
              const nx=cx+nx8[d],ny=cy+ny8[d];
              if(nx<0||nx>=w||ny<0||ny>=h)continue;
              const ni=ny*w+nx;
              if(labels[ni])continue;
              if(cells[ni]===targetPi){labels[ni]=currentLabel;queue.push(ni)}
            }
          }
          sizes[currentLabel]=size;
        }
      }
      const labelMap=new Int32Array(currentLabel+1);
      for(let l=1;l<=currentLabel;l++){
        if(sizes[l]>=threshold){labelMap[l]=l;continue}
        const visited=new Set([l]);
        let bestNeighbor=-1,bestSize=0;
        const q=[l];
        while(q.length){
          const curLabel=q.shift();
          const pixelIndices=[];
          for(let i=0;i<N;i++){if(labels[i]===curLabel)pixelIndices.push(i)}
          for(const idx of pixelIndices){
            const px=idx%w,py=(idx-px)/w;
            for(let d=0;d<8;d++){
              const nx=px+nx8[d],ny=py+ny8[d];
              if(nx<0||nx>=w||ny<0||ny>=h)continue;
              const ni=ny*w+nx;
              const nLabel=labels[ni];
              if(visited.has(nLabel))continue;
              visited.add(nLabel);
              if(sizes[nLabel]>bestSize){bestSize=sizes[nLabel];bestNeighbor=nLabel}
              q.push(nLabel);
            }
          }
        }
        labelMap[l]=bestNeighbor>0?bestNeighbor:l;
      }
      const newCells=cells.slice();
      for(let l=1;l<=currentLabel;l++){
        if(labelMap[l]===l)continue;
        for(let i=0;i<N;i++){
          if(labels[i]===l){
            const x=i%w,y=(i-x)/w;
            const counts={};
            for(let d=0;d<8;d++){
              const nx=x+nx8[d],ny=y+ny8[d];
              if(nx<0||nx>=w||ny<0||ny>=h)continue;
              const ni=ny*w+nx;
              const pi=newCells[ni];
              counts[pi]=(counts[pi]||0)+1;
            }
            let best=0,bestCount=0;
            for(const pi in counts)if(counts[pi]>bestCount){bestCount=counts[pi];best=+pi}
            newCells[i]=best;
          }
        }
      }
      for(let i=0;i<N;i++)cells[i]=newCells[i];
    }
    function generate(silent){
      if(!img)return;
      silentGenerate=!!silent;
      $('#localStatus').textContent=silent?'批量生成中…':'处理中…';
      setTimeout(()=>{
        const sourceW=img.naturalWidth||img.width,sourceH=img.naturalHeight||img.height;
        const w=+$(`#gridWidth`).value,h=Math.max(1,Math.round(w*sourceH/sourceW));
        const tmp=document.createElement('canvas'),tc=tmp.getContext('2d',{willReadFrequently:true});
        tmp.width=w;tmp.height=h;
        tc.imageSmoothingEnabled=true;tc.imageSmoothingQuality='high';
        if($('#mirror').checked){tc.translate(w,0);tc.scale(-1,1)}
        tc.drawImage(img,0,0,w,h);
        let data=tc.getImageData(0,0,w,h).data;
        let pal=palettes.mard;
        const max=+$(`#maxColors`).value;
        const br=+$(`#bright`).value*2.2;
        const sat=1+(+$(`#sat`).value/100);
        const smooth=+$(`#smooth`).value;
        let samples=[];
        for(let i=0;i<data.length;i+=4){
          let r=data[i]+br,g=data[i+1]+br,b=data[i+2]+br;
          const gray=.299*r+.587*g+.114*b;
          r=gray+(r-gray)*sat;g=gray+(g-gray)*sat;b=gray+(b-gray)*sat;
          samples.push([Math.max(0,Math.min(255,r)),Math.max(0,Math.min(255,g)),Math.max(0,Math.min(255,b))]);
        }
        if(max<=2){
          const grayVals=samples.map(c=>0.299*c[0]+0.587*c[1]+0.114*c[2]);
          let hist=new Array(256).fill(0);
          grayVals.forEach(v=>hist[Math.round(v)]++);
          const total=grayVals.length;
          let sumTotal=0;
          for(let i=0;i<256;i++)sumTotal+=i*hist[i];
          let wB=0,sumB=0,maxVar=-1,threshold=128;
          for(let t=0;t<256;t++){
            wB+=hist[t];
            if(wB===0)continue;
            const wF=total-wB;
            if(wF===0)break;
            sumB+=t*hist[t];
            const mB=sumB/wB;
            const mF=(sumTotal-sumB)/wF;
            const between=wB*wF*(mB-mF)*(mB-mF);
            if(between>maxVar){maxVar=between;threshold=t}
          }
          let blackIdx=0,whiteIdx=0,minG=256,maxG=-1;
          for(let pi=0;pi<pal.length;pi++){
            const gr=rgb(pal[pi][2]);
            const g=0.299*gr[0]+0.587*gr[1]+0.114*gr[2];
            if(g<minG){minG=g;blackIdx=pi}
            if(g>maxG){maxG=g;whiteIdx=pi}
          }
          const cells=new Array(w*h);
          for(let y=0;y<h;y++)for(let x=0;x<w;x++){
            const i=y*w+x;
            cells[i]=grayVals[i]<threshold?blackIdx:whiteIdx;
          }
          denoise(cells,w,h,pal,smooth);
          result={w,h,cells,pal};
          finishGenerate();
          return;
        }
        let usage=pal.map((p,pi)=>[pi,0]);
        samples.forEach(c=>{
          let best=0,bd=Infinity;
          for(let pi=0;pi<pal.length;pi++){
            const dd=dist(c,rgb(pal[pi][2]));
            if(dd<bd){bd=dd;best=pi}
          }
          usage[best][1]++;
        });
        usage.sort((a,b)=>b[1]-a[1]);
        const allowed=usage.filter(x=>x[1]>0).slice(0,Math.min(max,pal.length)).map(x=>x[0]);
        const work=samples.map(x=>x.slice());
        const cells=new Array(w*h);
        for(let y=0;y<h;y++)for(let x=0;x<w;x++){
          const i=y*w+x,c=work[i];
          let best=allowed[0],bd=Infinity;
          allowed.forEach(pi=>{const dd=dist(c,rgb(pal[pi][2]));if(dd<bd){bd=dd;best=pi}});
          cells[i]=best;
          if(dither){
            const q=rgb(pal[best][2]),er=[c[0]-q[0],c[1]-q[1],c[2]-q[2]];
            [[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]].forEach(([dx,dy,f])=>{
              const nx=x+dx,ny=y+dy;
              if(nx>=0&&nx<w&&ny<h){
                const n=work[ny*w+nx];
                for(let k=0;k<3;k++)n[k]+=er[k]*f;
              }
            });
          }
        }
        denoise(cells,w,h,pal,smooth);
        result={w,h,cells,pal};
        finishGenerate();
      },10);
    }
    function finishGenerate(){
      if(currentIdx>=0&&images[currentIdx])images[currentIdx].result=result;
      if(currentIdx>=0)images[currentIdx].canvas=makePatternCanvas(currentIdx);
      if(!silentGenerate){
        render();
        stats();
        $('#localStatus').textContent='✓ 已在本地生成';
        $('#download').disabled=false;
        $('#downloadLabel').textContent=images.length>1?`下载全部 ${images.length} 张`:'下载';
        canvas.hidden=false;
        $('#empty').hidden=true;
      }
      if(!$('#collagePage').hidden){renderCollageTray();renderCollage()}
      if(collageGenQueue){
        const done=images.filter(x=>x.result).length;
        showCollageNotice(`正在生成 ${done}/${done+collageGenQueue.length}…`,false);
        setTimeout(()=>generateNextInCollage(),30);
      }
    }
    function getUsedCounts(){
      const {cells,pal}=result;
      const counts={};
      cells.forEach(pi=>{counts[pi]=(counts[pi]||0)+1});
      const used=Object.entries(counts).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
      const totalDisp=cells.length;
      return{counts,used,totalDisp};

    function render(scale=0){
      if(!result)return;

      const showCodes=$('#showCodes').checked;
      const showAxis=$('#showAxis').checked;
      const showLegend=$('#showLegend').checked;
      const cell=scale||Math.max(showCodes?28:16,Math.min(42,Math.floor(900/w)));
      const axis=showAxis?Math.max(26,Math.round(cell*.92)):0;
      const {used,totalDisp}=getUsedCounts();
      const gridPixelW=w*cell;
      let legendH=0;
      if(showLegend){
        const legendCols=Math.max(1,Math.min(14,used.length));
        const tileW=gridPixelW/legendCols;
        const swatch=Math.max(cell*1.35,Math.min(cell*2,tileW-10));
        const legendRowH=swatch+Math.max(20,cell*.75);
        const legendRows=Math.ceil(used.length/legendCols);
        const legendTitleH=Math.max(34,cell*1.25);
        legendH=legendTitleH+legendRows*legendRowH+26;
      }
      canvas.width=gridPixelW+axis*2+1;
      canvas.height=h*cell+axis*2+legendH+1;
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.font=`700 ${Math.max(9,cell*.32)}px monospace`;
      const ox=axis,oy=axis;
      cells.forEach((pi,i)=>{
        const p=pal[pi],c=rgb(p[2]);
        const x=i%w,y=Math.floor(i/w);
        const px=ox+x*cell,py=oy+y*cell;
        ctx.fillStyle=p[2];
        ctx.fillRect(px,py,cell,cell);
        if(showCodes&&cell>=22){
          const bright=(c[0]*.299+c[1]*.587+c[2]*.114);
          ctx.fillStyle=bright>155?'#252525':'#fff';
          ctx.fillText(p[0],px+cell/2,py+cell/2);
        }
      });
      if($('#showGrid').checked){
        ctx.lineWidth=1;ctx.strokeStyle='#777b7738';ctx.beginPath();
        for(let x=0;x<=w;x++){ctx.moveTo(ox+x*cell+.5,oy);ctx.lineTo(ox+x*cell+.5,oy+h*cell)}
        for(let y=0;y<=h;y++){ctx.moveTo(ox,oy+y*cell+.5);ctx.lineTo(ox+w*cell,oy+y*cell+.5)}
        ctx.stroke();
      }
      if($('#boardLines').checked){
        for(let x=0;x<=w;x+=5){
          ctx.lineWidth=x%10===0?2.8:1.6;
          ctx.strokeStyle=x%10===0?'#b9473f':'#c96c65';
          ctx.beginPath();ctx.moveTo(ox+x*cell,oy);ctx.lineTo(ox+x*cell,oy+h*cell);ctx.stroke();
        }
        for(let y=0;y<=h;y+=5){
          ctx.lineWidth=y%10===0?2.8:1.6;
          ctx.strokeStyle=y%10===0?'#b9473f':'#c96c65';
          ctx.beginPath();ctx.moveTo(ox,oy+y*cell);ctx.lineTo(ox+w*cell,oy+y*cell);ctx.stroke();
        }
      }
      if(showAxis){
        ctx.fillStyle='#eef0ed';
        ctx.fillRect(ox,0,w*cell,axis);
        ctx.fillRect(ox,oy+h*cell,w*cell,axis);
        ctx.fillRect(0,oy,axis,h*cell);
        ctx.fillRect(ox+w*cell,oy,axis,h*cell);
        ctx.fillStyle='#555a57';
        ctx.font=`600 ${Math.max(9,cell*.3)}px sans-serif`;
        for(let x=0;x<w;x++){ctx.fillText(x+1,ox+x*cell+cell/2,axis/2);ctx.fillText(x+1,ox+x*cell+cell/2,oy+h*cell+axis/2)}
        for(let y=0;y<h;y++){ctx.fillText(y+1,axis/2,oy+y*cell+cell/2);ctx.fillText(y+1,ox+w*cell+axis/2,oy+y*cell+cell/2)}
      }
      if(showLegend&&legendH>0){
        const legendCols=Math.max(1,Math.min(14,used.length));
        const tileW=gridPixelW/legendCols;
        const swatch=Math.max(cell*1.35,Math.min(cell*2,tileW-10));
        const legendRowH=swatch+Math.max(20,cell*.75);
        const legendRows=Math.ceil(used.length/legendCols);
        const legendTitleH=Math.max(34,cell*1.25);
        const legendTop=oy+h*cell+axis;
        ctx.fillStyle='#f7f7f4';
        ctx.fillRect(0,legendTop,canvas.width,legendH);
        ctx.strokeStyle='#dedfd7';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,legendTop+.5);ctx.lineTo(canvas.width,legendTop+.5);ctx.stroke();
        ctx.fillStyle='#20221e';ctx.textAlign='left';ctx.font=`700 ${Math.max(13,cell*.6)}px sans-serif`;
        ctx.fillText('MARD-221  ·  总数 '+totalDisp.toLocaleString()+' 颗',ox,legendTop+legendTitleH/2);
        ctx.textAlign='center';
        const ly=legendTop+legendTitleH;
        used.forEach(([pi,n],i)=>{
          const col=i%legendCols,row=Math.floor(i/legendCols);
          const cx=ox+col*tileW+tileW/2,y=ly+row*legendRowH;
          const hex=pal[pi][2],c=rgb(hex);
          const sx=cx-swatch/2;
          ctx.fillStyle=hex;
          ctx.beginPath();
          const r=Math.max(5,swatch*.14);
          if(ctx.roundRect){ctx.roundRect(sx,y,swatch,swatch,r)}else{ctx.rect(sx,y,swatch,swatch)}
          ctx.fill();
          ctx.strokeStyle='#00000012';ctx.lineWidth=1;ctx.stroke();
          ctx.fillStyle=(c[0]*.299+c[1]*.587+c[2]*.114)>155?'#20221e':'#fff';
          ctx.font=`700 ${Math.max(10,swatch*.35)}px sans-serif`;
          ctx.fillText(pal[pi][0],cx,y+swatch/2);
          ctx.fillStyle='#20221e';ctx.font=`500 ${Math.max(11,cell*.5)}px sans-serif`;
          ctx.fillText('×'+n,cx,y+swatch+Math.max(11,cell*.35));

      const im=images[idx];if(!im||!im.result)return null;

        for(let y=0;y<=h;y++){cx.moveTo(axis,axis+y*cell+.5);cx.lineTo(axis+w*cell,axis+y*cell+.5)}

      if(showBoard){
        for(let x=0;x<=w;x+=5){cx.lineWidth=x%10===0?2.2:1.2;cx.strokeStyle=x%10===0?'#b9473f':'#c96c65';cx.beginPath();cx.moveTo(axis+x*cell+.5,axis);cx.lineTo(axis+x*cell+.5,axis+h*cell);cx.stroke()}
        for(let y=0;y<=h;y+=5){cx.lineWidth=y%10===0?2.2:1.2;cx.beginPath();cx.moveTo(axis,axis+y*cell+.5);cx.lineTo(axis+w*cell,axis+y*cell+.5);cx.stroke()}
      }

        cx.fillStyle='#757575';cx.font=`600 ${Math.max(9,cell*.35)}px sans-serif`;
        cx.textAlign='center';cx.textBaseline='middle';
        for(let x=0;x<w;x++){cx.fillText(String(x+1),axis+x*cell+cell/2,axis/2)}

    function getGridDim(n){if(n<=2)return[1,2];if(n<=4)return[2,2];if(n<=6)return[2,3];return[3,3]}
    function renderCollage(){
      if(!collageCanvas||!cctx)return;
      const imgs=collage.order.map(i=>images[i]).filter(Boolean);
      if(imgs.length===0)return;
      const [rows,cols]=getGridDim(collage.grid);
      const gap=collage.gap;
      const maxW=Math.min(window.innerWidth-80,960);
      const maxH=window.innerHeight-340;
      const cellW=Math.floor((maxW-gap*(cols-1))/cols);
      const cellH=Math.floor((maxH-gap*(rows-1))/rows);
      const cell=Math.max(40,Math.min(cellW,cellH));
      const w=cell*cols+gap*(cols-1);
      const h=cell*rows+gap*(rows-1);
      collageCanvas.width=w;
      collageCanvas.height=h;
      cctx.fillStyle='#f5f5f5';
      cctx.fillRect(0,0,w,h);
      for(let i=0;i<rows*cols;i++){
        const r=Math.floor(i/cols),c=i%cols;
        const sx=c*(cell+gap),sy=r*(cell+gap);
        const im=imgs[i];
        const pad=Math.max(1,gap>=8?2:0);
        if(im){
          const src=im.canvas||im.img;
          const sw=src.width||src.naturalWidth;
          const sh=src.height||src.naturalHeight;
          if(sw>0&&sh>0){
            const scale=Math.max((cell-pad*2)/sw,(cell-pad*2)/sh);
            const dw=sw*scale,dh=sh*scale;
            const dx=sx+(cell-dw)/2,dy=sy+(cell-dh)/2;
            cctx.fillStyle='#fff';
            cctx.fillRect(sx+pad,sy+pad,cell-pad*2,cell-pad*2);
            cctx.drawImage(src,dx,dy,dw,dh);
          }
        }else{
          cctx.fillStyle='#e8e8e8';
          cctx.fillRect(sx,sy,cell,cell);
        }
      }
      if(collage.selectedCell>=0){
        const [rows,cols]=getGridDim(collage.grid);
        const gap=collage.gap;
        const cellW=(collageCanvas.width-gap*(cols-1))/cols;
        const cellH=(collageCanvas.height-gap*(rows-1))/rows;
        const c=collage.selectedCell%cols,r=Math.floor(collage.selectedCell/cols);
        const sx=c*(cellW+gap)+2,sy=r*(cellH+gap)+2;
        cctx.save();
        cctx.strokeStyle='#6750a4';cctx.lineWidth=3;
        cctx.strokeRect(sx,sy,cellW-4,cellH-4);
        cctx.restore();
      }
      drawHoverHighlight();
    }

          if(collage.dragFrom!==null&&collage.dragFrom!==to){
            const fi=collage.order.indexOf(collage.dragFrom);
            const ti=collage.order.indexOf(to);
            if(fi>=0&&ti>=0){
              collage.order.splice(fi,1);
              collage.order.splice(ti,0,collage.dragFrom);
            }
            renderCollageTray();renderCollage();
          }
          collage.dragFrom=null;
        });
      });
      [...tray.querySelectorAll('.slot-del')].forEach(btn=>btn.onclick=e=>{
        e.stopPropagation();
        const idx=+btn.dataset.del;
        const pos=collage.order.indexOf(idx);
        if(pos>=0){collage.order.splice(pos,1)}
        const maxGrid=images.length>=9?9:images.length>=6?6:images.length>=4?4:2;
        if(collage.grid>maxGrid)collage.grid=maxGrid;
        $('#collageGridPicker button').forEach(b=>{
          const g=+b.dataset.grid;
          b.classList.toggle('active',g===collage.grid);
          b.style.display=g<=maxGrid?'':'none';
        });
        renderCollageTray();renderCollage();
      });
    }
    let collageHover={cell:-1};
    function drawHoverHighlight(){
      if(collageHover.cell<0||!collageCanvas||!cctx)return;
      const [rows,cols]=getGridDim(collage.grid);
      const gap=collage.gap;
      const cellW=(collageCanvas.width-gap*(cols-1))/cols;
      const cellH=(collageCanvas.height-gap*(rows-1))/rows;
      const c=collageHover.cell%cols,r=Math.floor(collageHover.cell/cols);
      const sx=c*(cellW+gap)+2,sy=r*(cellH+gap)+2;
      const sW=cellW-4,sH=cellH-4;
      cctx.save();
      cctx.strokeStyle='rgba(103,80,164,.85)';
      cctx.lineWidth=3;
      cctx.setLineDash([6,4]);
      cctx.strokeRect(sx,sy,sW,sH);
      cctx.restore();
    }
    function hitTestCell(clientX,clientY){
      const rect=collageCanvas.getBoundingClientRect();
      const x=(clientX-rect.left)*(collageCanvas.width/rect.width);
      const y=(clientY-rect.top)*(collageCanvas.height/rect.height);
      const [rows,cols]=getGridDim(collage.grid);
      const gap=collage.gap;
      const cellW=(collageCanvas.width-gap*(cols-1))/cols;
      const cellH=(collageCanvas.height-gap*(rows-1))/rows;
      const c=Math.floor(x/(cellW+gap));
      const r=Math.floor(y/(cellH+gap));
      if(c<0||c>=cols||r<0||r>=rows)return-1;
      return r*cols+c;
    }
    if(collageCanvas){
      collageCanvas.addEventListener('mousemove',e=>{
        if(collage.dragFrom===null&&collage.selectedCell<0){collageHover.cell=-1;return}
        const cell=hitTestCell(e.clientX,e.clientY);
        if(cell!==collageHover.cell){collageHover.cell=cell;renderCollage()}
      });
      collageCanvas.addEventListener('mouseleave',()=>{collageHover.cell=-1;renderCollage()});
      collageCanvas.addEventListener('dragover',e=>{
        e.preventDefault();e.dataTransfer.dropEffect='move';
        const cell=hitTestCell(e.clientX,e.clientY);
        if(cell!==collageHover.cell){collageHover.cell=cell;renderCollage()}
      });
      collageCanvas.addEventListener('click',e=>{
        const cell=hitTestCell(e.clientX,e.clientY);
        if(cell<0)return;
        if(collage.selectedCell<0){collage.selectedCell=cell;renderCollage();return}
        if(collage.selectedCell===cell){collage.selectedCell=-1;renderCollage();return}
        const a=collage.selectedCell,b=cell;
        const ai=collage.order[a],bi=collage.order[b];
        if(ai!==undefined&&bi!==undefined){
          collage.order[a]=bi;collage.order[b]=ai;
        }else{
          const items=collage.order.slice();
          const fromIdx=Math.min(a,b);const toIdx=Math.max(a,b);
          const [moved]=items.splice(fromIdx,1);
          items.splice(toIdx,0,moved);
          collage.order=items;
        }
        collage.selectedCell=-1;
        renderCollageTray();renderCollage();
      });
      collageCanvas.addEventListener('drop',e=>{
        e.preventDefault();
        const cell=hitTestCell(e.clientX,e.clientY);
        collageHover.cell=-1;
        if(collage.dragFrom===null)return;
        const toIdx=Math.max(0,Math.min(collage.order.length-1,cell));
        const fi=collage.order.indexOf(collage.dragFrom);
        if(fi<0){collage.dragFrom=null;return}
        const items=collage.order.slice();
        items.splice(fi,1);
        let insertAt=Math.min(toIdx,items.length);
        if(fi<toIdx)insertAt=Math.max(0,Math.min(items.length,toIdx-1));
        items.splice(insertAt,0,collage.dragFrom);
        collage.order=items;
        renderCollageTray();renderCollage();
        collage.dragFrom=null;
      });
    }
    $('#collageFab').onclick=openCollage;
    $('#collageBack').onclick=closeCollage;
    $('#collageGridPicker').onclick=e=>{
      const btn=e.target.closest('button');if(!btn)return;
      $('#collageGridPicker button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      collage.grid=+btn.dataset.grid;
      renderCollage();
    };
    $('#collageGap').oninput=e=>{
      collage.gap=+e.target.value;
      $('#gapVal').textContent=collage.gap;
      renderCollage();
    };
    $('#collageDownload').onclick=()=>{
      if(collage.order.length===0)return toast('没有图片可下载');
      const imgs=collage.order.map(i=>images[i]).filter(Boolean);
      const [rows,cols]=getGridDim(collage.grid);
      const gap=collage.gap;
      const scale=2;
      const cellSize=280;
      const w=cellSize*cols+gap*(cols-1);
      const h=cellSize*rows+gap*(rows-1);
      const dl=document.createElement('canvas');
      dl.width=w*scale;dl.height=h*scale;
      const dc=dl.getContext('2d');
      dc.scale(scale,scale);
      dc.fillStyle='#fff';
      dc.fillRect(0,0,w,h);
      for(let i=0;i<rows*cols;i++){
        const r=Math.floor(i/cols),c=i%cols;
        const sx=c*(cellSize+gap),sy=r*(cellSize+gap);
        const im=imgs[i];
        const pad=Math.max(1,gap>=8?4:0);
        if(im){
          const src=im.canvas||im.img;
          const sw=src.width||src.naturalWidth;
          const sh=src.height||src.naturalHeight;
          const s=Math.max((cellSize-pad*2)/sw,(cellSize-pad*2)/sh);
          const dw=sw*s,dh=sh*s;
          const dx=sx+(cellSize-dw)/2,dy=sy+(cellSize-dh)/2;
          dc.fillStyle='#fff';
          dc.fillRect(sx+pad,sy+pad,cellSize-pad*2,cellSize-pad*2);
          dc.drawImage(src,dx,dy,dw,dh);
        }else{
          dc.fillStyle='#e8e8e8';
          dc.fillRect(sx,sy,cellSize,cellSize);
        }
      }
      dl.toBlob(blob=>{
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        const ts=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
        a.download=`拼豆拼图-${collage.grid}宫格-${collage.gap}px-${ts}.png`;
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),2000);
        toast('拼图已下载');
      },'image/png',1.0);
    };
    window.addEventListener('resize',()=>{if(!$('#collagePage').hidden)renderCollage()});
  </script>
</body>
</html>
